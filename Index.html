<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Product Card</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link href="Style.css" rel="stylesheet" />
</head>
<body>
<div class="scene">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="card">
    <div class="card__image-wrap">
      <img
        class="card__image"
        src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=680&q=80"
        alt="Luxury Watch"
      />
      <span class="card__badge">New Arrival</span>
      <div class="card__wishlist">♡</div>
    </div>

    <div class="card__body">
      <p class="card__category">Horology · Limited</p>
      <h2 class="card__name">Chronos Noir<br>Timepiece</h2>
      <p class="card__desc">Swiss-crafted automatic movement with sapphire crystal and 72-hour power reserve. A statement for the discerning.</p>
      <div class="card__rating">
        <span class="stars">★★★★★</span>
        <span class="rating-count">4.9 (312 reviews)</span>
      </div>
    </div>

    <div class="card__footer">
      <div class="card__pricing">
        <span class="card__price">$2,490</span>
        <span class="card__original">$3,200</span>
      </div>
      <button class="card__btn">Add to Cart</button>
    </div>
  </div>
</div>
</body>
</html>
